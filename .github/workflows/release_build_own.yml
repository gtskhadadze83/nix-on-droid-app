name: Build Release

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      - shell: bash {0}
        run: |
           ./gradlew assembleRelease
           CURRENT_VERSION_NAME_REGEX='\s+versionName "([^"]+)"$'
           CURRENT_VERSION_NAME="$(grep -m 1 -E "$CURRENT_VERSION_NAME_REGEX" ./app/build.gradle | sed -r "s/$CURRENT_VERSION_NAME_REGEX/\1/")"
           echo "CURRENT_VERSION_NAME=$CURRENT_VERSION_NAME" >> $GITHUB_ENV
        env:
          TERMUX_PACKAGE_VARIANT: "apt-android-7"
          TERMUX_APK_VERSION_TAG: "nix"
          APK_VERSION_NAME: ${CURRENT_VERSION_NAME}
          
      - uses: actions/upload-artifact@v6
        with:
          name: termux-app_${{ env.CURRENT_VERSION_NAME }}
          path: app/build/outputs/apk/**/*.apk
